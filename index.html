function sourceInspector(s){return `<main class="inspector"><div class="inspector-head"><div><span class="largeicon">${ico(s[1]==='漫画'?'image':s[1]==='视频'?'play':s[1]==='音频'?'volume':'book')}</span><div><strong>${s[0]}</strong><small>https://example.com/source/${state.sourceIndex+1}</small></div></div><span class="switch"></span></div><div class="inspector-actions"><button>${ico('search')}测试</button><button>${ico('user')}登录</button><button>${ico('tune')}编辑</button><button>${ico('import')}导出</button></div><section class="section"><small>能力</small><div class="caps"><span>${ico('search')}搜索</span><span>${ico('book')}详情</span><span>${ico('list')}目录</span><span>${ico('text')}正文</span></div></section><section class="section"><small>运行状态</small><div class="backup-hero" style="grid-template-columns:10px 1fr auto;min-height:60px"><span class="status"></span><div><strong>最近请求正常</strong><small>平均响应 380ms · 5 分钟前检查</small></div><button class="secondary">重新测试</button></div></section><section class="section"><small>网络与身份</small><div class="rows">${row('#','user','登录状态','已保存 Cookie，可重新登录')}${row('#','network','请求配置','使用来源默认 User-Agent')}</div></section><button class="danger">删除这个来源</button></main>`}

function appearance(){return `<section class="workspace">${headbar('阅读与播放','消费内容时的显示和行为','me')}<div class="content preview-settings"><aside><div class="device"><small>第 23 章</small><h3>山水之间</h3><p>夜色从远处一点点漫过来，山脊只剩下淡淡的轮廓。风穿过树梢，声音很轻。</p><p>很多时候，人并不是不知道答案，只是还没准备好承认答案。</p></div></aside><main class="settings"><section><h3>文字</h3>${setting('字号','正文显示大小','<input type="range" value="18"><b>18</b>')}${setting('行距','段落阅读密度','<input type="range" value="18"><b>1.8</b>')}${setting('字体','仅影响显示','<select><option>系统字体</option><option>衬线字体</option></select>')}</section><section><h3>主题</h3><div class="themes"><button><i class="t1"></i>纸张</button><button><i class="t2"></i>暖色</button><button><i class="t3"></i>夜间</button><button><i class="t4"></i>跟随系统</button></div></section><section><h3>播放</h3>${setting('音频默认倍速','有声内容播放速度','<select><option>1.0×</option><option>1.25×</option><option>1.5×</option></select>')}${setting('视频默认清晰度','可用时优先','<select><option>自动</option><option>1080P</option><option>720P</option></select>')}</section></main></div></section>`}

function backup(){return `<section class="workspace">${headbar('数据与同步','备份、恢复和迁移','me')}<div class="content narrow"><section class="backup-hero"><span class="largeicon">${ico('backup')}</span><div><strong>最近备份</strong><small>昨天 23:18 · 428 MB</small></div><button class="primary">立即备份</button></section><div class="settings-group"><small>本地</small>${row('#','import','导出备份文件','内容库、历史、书签、设置、来源和缓存')}${row('#','backup','从备份恢复','会替换当前本地数据')}</div><div class="settings-group"><small>WebDAV</small><label class="field"><span>地址</span><input value="https://example.com/remote.php/dav/files/user/"></label><label class="field"><span>用户名</span><input value="alice"></label><label class="field"><span>密码</span><input type="password" value="password"></label><div style="display:flex;justify-content:flex-end;gap:8px"><button class="secondary">测试连接</button><button class="primary">保存</button></div></div></div></section>`}
function settingsPage(){return `<section class="workspace">${headbar('高级设置','低频但重要的应用能力','me')}<div class="content narrow"><div class="settings-group"><small>内容引擎</small>${row('rules','rule','替换与净化','文本替换规则和订阅')}${row('txttoc','text','TXT 目录识别','章节正则与优先级')}${row('discovery-config','tune','发现页配置','标签、栏目与展示方式')}</div><div class="settings-group"><small>网络与缓存</small>${row('#','download','正文缓存','486 MB · 1,612 个缓存项')}${row('#','network','网络请求','超时、重试和更新检查')}</div><div class="settings-group"><small>朗读</small>${row('tts','tts','TTS 朗读源','系统语音和 HTTP TTS')}</div></div></section>`}

function editorPage(kind){let map={rules:['替换与净化','显示前处理内容文本',['去除章节尾广告','净化作者求票','统一空行','隐藏来源尾注']],txttoc:['TXT 目录识别','导入 TXT 时如何识别章节',['中文章节','Chapter N','卷章组合','数字标题']],tts:['TTS 朗读源','系统语音与网络朗读',['系统语音','Edge TTS · zh-CN','自建 Azure TTS','旧测试源']]},m=map[kind],mob=innerWidth<=860;let rows=m[2].map((x,i)=>`<button class="master-row ${i===0?'active':''}" data-editor="${kind}"><span class="status ${i===3?'off':''}"></span><span><strong>${x}</strong><small>${kind==='rules'?'正文':kind==='txttoc'?'优先级 '+(i+1):i===0?'系统':'HTTP TTS'}</small></span><span class="chev">${ico('right')}</span></button>`).join('');if(mob)return `<section class="workspace">${headbar(m[0],m[1],'settings','<button class="primary">+ 新建</button>')}<div class="content" style="padding-top:12px">${rows}</div></section>`;return `<section class="workspace">${headbar(m[0],m[1],'settings','<button class="primary">+ 新建</button>')}<div class="workbench"><aside class="master">${rows}</aside><main class="editor">${editorBody(kind)}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="secondary">还原</button><button class="primary">保存</button></div></main></div></section>`}
function editorDetail(kind){let map={rules:['替换净化规则','rules'],txttoc:['TXT 目录规则','txttoc'],tts:['HTTP TTS 配置','tts']},m=map[kind];return `<section class="workspace">${headbar(m[0],'编辑配置',m[1],'<button class="primary">保存</button>')}<main class="content narrow editor" style="padding-top:18px">${editorBody(kind)}</main></section>`}
function discoveryConfig(){return `<section class="workspace">${headbar('发现页配置','控制发现页的内容组织','settings','<button class="primary">保存</button>')}<div class="content narrow"><div class="chips"><button style="background:#202126;color:#fff">推荐</button><button>小说</button><button>漫画</button><button>视频</button></div><div class="config-list">${[['今日热门','源仓 · 小说源 A','封面流'],['漫画追更','MangaHub','横向滚动'],['高分视频','StreamSource CN','封面流'],['睡前听','Podcast RSS','紧凑列表']].map(x=>`<article class="config-card"><span class="drag"><i></i><i></i><i></i><i></i></span><div><input value="${x[0]}"><small>${x[1]}</small></div><select><option>${x[2]}</option><option>榜单</option></select><button class="iconbtn">${ico('more')}</button></article>`).join('')}</div></div></section>`}
function detail(type){let x=items.find(i=>i.type===type)||state.selected;state.selected=x;let tabs=['overview','catalog','sources'];return `<section class="detail"><header class="detail-nav"><button class="iconbtn" data-main="discover">${ico('left')}</button><nav>${[['overview','概览'],['catalog',x.type==='video'?'剧集':x.type==='audio'?'节目':'目录'],['sources','来源']].map(t=>`<button data-dtab="${t[0]}" class="${state.detailTab===t[0]?'active':''}">${t[1]}</button>`).join('')}</nav><div style="display:flex"><button class="iconbtn">${ico('more')}</button></div></header>${state.detailTab==='overview'?detailOverview(x):state.detailTab==='catalog'?detailCatalog(x):detailSources(x)}</section>`}
function detailOverview(x){return `<main class="detail-body"><section class="hero"><div class="cover" style="--c1:${x.c1};--c2:${x.c2}"></div><div class="meta"><small>${label(x.type)} · ${x.kind}</small><h1>${x.title}</h1><p>${x.author}</p><div class="hero-actions"><button class="primary" data-reader="${x.type}">${x.type==='video'?ico('play')+' 继续观看':x.type==='audio'?ico('volume')+' 继续收听':ico('book')+' 继续阅读'}</button><button class="secondary">收藏</button></div></div><aside class="progressbox"><small>${x.type==='video'?'观看':x.type==='audio'?'收听':'阅读'}进度</small><strong>${x.progress}</strong><span class="bar"><i style="width:${x.pct}%"></i></span><button data-dtab="catalog">查看${x.type==='video'?'剧集':x.type==='audio'?'节目':'目录'}</button></aside></section><section class="facts"><div><small>规模</small><strong>${x.size}</strong></div><div><small>更新</small><strong>${x.latest}</strong></div><div><small>来源</small><strong>${x.source}</strong></div><div><small>缓存</small><strong>38%</strong></div></section><section class="detail-section"><header><strong>简介</strong></header><p>${x.intro}</p></section><section class="detail-section"><header><strong>最近内容</strong><button data-dtab="catalog">全部 ${ico('right')}</button></header>${detailCatalogRows(x,4)}</section></main>`}
function detailCatalog(x){return `<main class="detail-body"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:12px"><label class="mini-search" style="width:300px">${ico('search')}<input placeholder="搜索${x.type==='video'?'剧集':x.type==='audio'?'节目':'章节'}"></label><div><button class="secondary">定位当前</button> <button class="secondary">排序</button> <button class="secondary">缓存全部</button></div></div>${detailCatalogRows(x,24)}</main>`}

function detailSources(x){return `<main class="detail-body" style="max-width:850px"><section class="block" style="margin-top:0;border-top:0"><strong>当前来源</strong><div class="backup-hero" style="margin-top:9px"><span class="largeicon">${ico('source')}</span><div><strong>${x.source}</strong><small>响应正常 · 380ms</small></div><button class="secondary">刷新信息</button></div></section><section class="block"><strong>可替换来源</strong><div class="source-list">${['源仓 · 线路 A','阅读源 · 线路 B','聚合源 · 线路 C'].map((s,i)=>`<article><div><strong>${s}</strong><span>作者一致 · ${i===1?'少 2 章':'更新至最新'}</span><small>响应 ${280+i*150}ms</small></div><button>${i===0?'当前':'切换'}</button></article>`).join('')}</div></section></main>`}
function reader(mode){let x=mode==='comic'?items[1]:mode==='video'?items[2]:mode==='audio'?items[5]:mode==='pdf'?items[3]:items[0];state.selected=x;let dock=mode==='novel'?`<footer class="reader-dock"><button data-sheet="directory">${ico('list')}<small>目录</small></button><button data-sheet="tts">${ico('tts')}<small>朗读</small></button><button data-sheet="display">${ico('appearance')}<small>显示</small></button></footer>`:mode==='comic'?`<footer class="reader-dock"><button data-sheet="episodes">${ico('list')}<small>选话</small></button><button data-sheet="mode">${ico('tune')}<small>阅读模式</small></button><button data-sheet="fit">${ico('appearance')}<small>图片适配</small></button><button data-sheet="brightness">${ico('sun')}<small>亮度</small></button></footer>`:mode==='pdf'?`<footer class="reader-dock"><button data-sheet="pages">${ico('list')}<small>页面</small></button><button data-sheet="search">${ico('search')}<small>搜索</small></button><button data-sheet="display">${ico('appearance')}<small>显示</small></button><button data-sheet="bookmark">${ico('bookmark')}<small>书签</small></button></footer>`:'';return `<section class="reader ${mode}-mode"><header class="reader-top"><button class="iconbtn" data-detail="${x.id}">${ico('left')}</button><div class="reader-title"><strong>${x.title}</strong><small>${mode==='video'?'第 18 集 · 山野之间':mode==='audio'?'EP.121 · 今天也辛苦了':mode==='comic'?'第 61 话 · 夏日':mode==='pdf'?'第 23 页':'第 923 章 · 山水之间'}</small></div><div class="reader-actions">${mode==='novel'?`<button class="iconbtn" data-sheet="search">${ico('search')}</button><button class="iconbtn" data-sheet="bookmark">${ico('bookmark')}</button>`:''}<button class="iconbtn">${ico('more')}</button></div></header><main class="reader-stage">${readerStage(mode,x)}</main>${dock}${state.sheet?sheet(mode):''}</section>`}
function readerStage(m,x){if(m==='novel')return `<article class="novel"><div class="novel-meta"><span>923 / 1268</span><span>73%</span></div><h1>第 923 章 · 山水之间</h1>${['夜色从远处一点点漫过来，山脊只剩下淡淡的轮廓。风穿过树梢，声音很轻，却把院子里最后一点暑气也带走了。','他把手里的书合上，想起白天那些没来得及说出口的话。很多时候，人并不是不知道答案，只是还没准备好承认答案。','窗外有车灯经过，光线在墙上晃了一下。桌上的水已经凉了，他却没有起身，只是继续听着远处若有若无的虫鸣。','有些事情只有走得足够远以后才能看清。那时候再回头，曾经以为无法跨过去的地方，也不过是路上的一个转弯。','第二天清晨，太阳照进房间的时候，他终于做出了决定。'].map(p=>`<p>${p}</p>`).join('')}<div class="chapter-end"><small>本章完</small><button>下一章 ${ico('right')}</button></div></article>`;if(m==='comic')return `<article class="comic-reader"><div class="comic-page"></div><div class="comic-page" style="background:linear-gradient(145deg,#5e515d,#1c1a20)"></div><span class="comic-count">12 / 24</span></article>`;if(m==='video')return `<article class="video-wrap"><div class="video-box"><div class="mountain"></div><button class="playbig">${ico('play')}</button><div class="video-controls"><div class="video-progress"><span>18:42</span><span class="bar"><i></i></span><span>42:06</span></div><div class="controlrow"><button>${ico('play')}</button><button>${ico('volume')}</button><span class="spacer"></span><select><option>1.0×</option><option>1.25×</option><option>1.5×</option><option>2.0×</option></select><select><option>1080P</option><option>720P</option></select><button>字幕</button><button>${ico('fullscreen')}</button></div></div></div><div class="video-meta"><div><strong>第 18 集 · 山野之间</strong><small>${x.title} · ${x.author}</small></div><button data-sheet="episodes">18 / 40 集 ${ico('right')}</button></div><div class="video-episode-strip"><header><strong>选集</strong><button data-sheet="episodes">全部 40 集 ${ico('right')}</button></header><div>${[17,18,19,20,21,22].map(n=>`<button class="${n===18?'active':''}">${n}</button>`).join('')}</div></div></article>`;if(m==='audio')return `<article class="audio-wrap"><div class="art"></div><div class="audio-info"><small>${x.author}</small><h1>${x.title}</h1><strong>EP.121 · 今天也辛苦了</strong><div class="wave">${Array.from({length:54},(_,i)=>`<i style="height:${9+(i*11)%34}px"></i>`).join('')}</div><div class="audio-progress"><span>18:42</span><span class="bar"><i style="width:44%"></i></span><span>42:06</span></div><div class="audio-main"><button>${ico('back15')}</button><button class="play">${ico('play')}</button><button>${ico('forward15')}</button></div><div class="audio-utils"><button data-sheet="speed"><strong>${state.speed}×</strong><small>倍速</small></button><button data-sheet="sleep">${ico('moon')}<small>睡眠</small></button><button data-sheet="episodes">${ico('list')}<small>节目</small></button></div></div></article>`;return `<article class="pdf"><aside>${Array.from({length:5},(_,i)=>`<span class="${i===2?'active':''}">${i+1}</span>`).join('')}</aside><div class="paper"><small>PDF · 第 23 页</small><h2>示例 PDF 页面</h2><p>这是一份用于验证跨平台排版的 PDF 文档。桌面端保留缩略页栏，移动端缩窄为最小导航。</p><p>内容区域始终保持适合阅读的最大宽度，而不是随着屏幕无限拉伸。</p></div></article>`}
function sheet(mode){let s=state.sheet;if(s==='speed')return `<aside class="sheet"><header><strong>播放速度</strong><button data-sheet="">${ico('close')}</button></header><div class="speedgrid">${['0.75','1.0','1.25','1.5','1.75','2.0'].map(x=>`<button data-speed="${x}" class="${state.speed===x?'active':''}">${x}×</button>`).join('')}</div></aside>`;if(s==='episodes'||s==='directory'||s==='pages')return `<aside class="sheet"><header><strong>${mode==='video'?'选集':mode==='audio'?'节目':mode==='comic'?'选话':mode==='pdf'?'页面':'目录'}</strong><button data-sheet="">${ico('close')}</button></header><label class="mini-search">${ico('search')}<input placeholder="搜索"></label>${Array.from({length:12},(_,i)=>`<button class="dir ${i===5?'current':''}"><span>${String(i+1).padStart(2,'0')}</span><strong>${mode==='video'?'第 '+(i+13)+' 集':mode==='audio'?'EP.'+(i+116):mode==='comic'?'第 '+(i+55)+' 话':'第 '+(i+918)+' 章 · 山水之间'}</strong>${i===5?'<small>当前</small>':''}</button>`).join('')}</aside>`;if(s==='mode')return `<aside class="sheet"><header><strong>阅读模式</strong><button data-sheet="">${ico('close')}</button></header><button class="choice active"><span><strong>上下连续</strong><small>适合条漫和连续阅读</small></span><i></i></button><button class="choice"><span><strong>左右翻页</strong><small>单页浏览，左右切换</small></span><i></i></button></aside>`;if(s==='fit')return `<aside class="sheet"><header><strong>图片适配</strong><button data-sheet="">${ico('close')}</button></header><button class="choice active"><span><strong>适合宽度</strong><small>图片宽度填满可视区域</small></span><i></i></button><button class="choice"><span><strong>原始大小</strong><small>保留原始尺寸</small></span><i></i></button></aside>`;if(s==='brightness')return `<aside class="sheet"><header><strong>亮度</strong><button data-sheet="">${ico('close')}</button></header><label class="sheetset">${ico('sun')}<input type="range" value="88"><strong>88%</strong></label></aside>`;if(s==='sleep')return `<aside class="sheet"><header><strong>睡眠定时</strong><button data-sheet="">${ico('close')}</button></header>${['关闭','15 分钟','30 分钟','45 分钟','60 分钟','本期结束'].map((x,i)=>`<button class="choice ${i===0?'active':''}"><span><strong>${x}</strong></span><i></i></button>`).join('')}</aside>`;if(s==='tts')return `<aside class="sheet"><header><strong>朗读</strong><button data-sheet="">${ico('close')}</button></header><label class="sheetset"><span>朗读引擎</span><select><option>系统默认</option><option>Edge TTS</option></select></label><label class="sheetset"><span>语速</span><select><option>1.0×</option><option>1.25×</option><option>1.5×</option></select></label><button class="primary" style="width:100%;margin-top:10px">开始朗读</button></aside>`;if(s==='display')return `<aside class="sheet"><header><strong>显示</strong><button data-sheet="">${ico('close')}</button></header><label class="sheetset"><span>翻页方式</span><select><option>左右翻页</option><option>上下滚动</option></select></label><label class="sheetset"><span>字号</span><input type="range" value="18"></label></aside>`;if(s==='bookmark')return `<aside class="sheet"><header><strong>书签</strong><button data-sheet="">${ico('close')}</button></header><label class="modalfield"><span>备注（可选）</span><textarea></textarea></label><button class="primary" style="width:100%;margin-top:10px">保存当前位置</button></aside>`;return `<aside class="sheet"><header><strong>搜索</strong><button data-sheet="">${ico('close')}</button></header><label class="mini-search">${ico('search')}<input placeholder="输入关键词"></label></aside>`}
function review(){let screens=[['discover','发现'],['library','内容库'],['me','我的'],['search','搜索'],['articles','订阅'],['library-manage','整理内容库'],['import','导入'],['history','历史'],['bookmarks','书签'],['tasks','下载与任务'],['sources','来源'],['source-detail','来源详情'],['appearance','阅读与播放'],['backup','数据与同步'],['settings','高级设置'],['rules','替换净化'],['rules-edit','规则编辑'],['txttoc','TXT 目录'],['txttoc-edit','目录规则编辑'],['tts','TTS'],['tts-edit','TTS 编辑'],['discovery-config','发现页配置'],['detail-novel','小说详情'],['detail-comic','漫画详情'],['detail-video','视频详情'],['detail-audio','音频详情'],['reader-novel','小说阅读器'],['reader-comic','漫画阅读器'],['reader-video','视频播放器'],['reader-audio','音频播放器'],['reader-pdf','PDF 阅读器']];return `<div class="review"><button data-review="1">界面索引</button>${state.review?`<aside class="reviewpanel"><header><div><strong>界面索引</strong><small>仅用于审阅</small></div><button class="iconbtn" data-review="0">${ico('close')}</button></header><div class="reviewgrid">${screens.map(x=>`<button data-screen="${x[0]}">${x[1]}</button>`).join('')}</div></aside>`:''}</div>`}
function render(){let s=state.screen;let html;if(['discover','library','me'].includes(s)) html=mainView(s);else if(s==='search')html=search();else if(s==='articles')html=articles();else if(s==='library-manage')html=manage();else if(s==='import')html=importPage();else if(s==='history')html=history();else if(s==='bookmarks')html=bookmarks();else if(s==='tasks')html=tasks();else if(s==='sources')html=sourcesPage();else if(s==='source-detail')html=sourceDetail();else if(s==='appearance')html=appearance();else if(s==='backup')html=backup();else if(s==='settings')html=settingsPage();else if(['rules','txttoc','tts'].includes(s))html=editorPage(s);else if(['rules-edit','txttoc-edit','tts-edit'].includes(s))html=editorDetail(s.replace('-edit',''));else if(s==='discovery-config')html=discoveryConfig();else if(s.startsWith('detail-'))html=detail(s.replace('detail-',''));else if(s.startsWith('reader-'))html=reader(s.replace('reader-',''));else html=mainView('discover');app.innerHTML=html+review();bind()}
function bind(){document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.main;state.type='all';state.sheet=null;render()});document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.sheet=null;state.review=false;render()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let x=items.find(i=>i.id===b.dataset.detail);state.selected=x;state.detailTab='overview';state.screen='detail-'+x.type;state.sheet=null;render()});document.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.dtab;render()});document.querySelectorAll('[data-reader]').forEach(b=>b.onclick=()=>{state.screen='reader-'+b.dataset.reader;state.sheet=null;render()});document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{state.sheet=b.dataset.sheet||null;render()});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{state.speed=b.dataset.speed;state.sheet=null;render()});document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{state.sourceIndex=+b.dataset.source;if(innerWidth<=860)state.screen='source-detail';render()});document.querySelectorAll('[data-editor]').forEach(b=>b.onclick=()=>{if(innerWidth<=860)state.screen=b.dataset.editor+'-edit';render()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.review=b.dataset.review==='1';render()})}
render();
</script></body></html>
